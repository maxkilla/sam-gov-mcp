name = "sam-gov-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Keep variables set in the Cloudflare dashboard. Without this, every `wrangler deploy`
# deletes dashboard-defined plain-text variables that are not in this file.
# (Secrets are never deleted, so prefer storing keys and tokens as Secrets.)
keep_vars = true

# Upstream response cache (see README). Namespace: sam-gov-mcp-cache
[[kv_namespaces]]
binding = "CACHE"
id = "2e6735d50f1a4b2fa2f7de0604d1bbf2"

# Saved searches, pipeline and vetting history. Schema: migrations/0001_init.sql
[[d1_databases]]
binding = "DB"
database_name = "sam-gov-mcp-db"
database_id = "07b30147-4398-4c96-9138-3168a48f3092"

# Daily refresh of saved searches (UTC).
[triggers]
crons = ["0 14 * * *"]

# Worker Previews (branch builds) use separate, empty resources so they never touch production data.
# Set MCP_AUTH_TOKEN as a Preview secret if you want to open a preview.
[[previews.kv_namespaces]]
binding = "CACHE"
id = "b0fc83310bdb45f689d6371fd6ce04c3"

[[previews.d1_databases]]
binding = "DB"
database_id = "c3db7e33-eed7-418d-86d1-0441e6435ee4"

# Secrets (never put these here):
#   wrangler secret put MCP_AUTH_TOKEN     # required: bearer token for your agents
#   wrangler secret put SAM_GOV_API_KEY    # optional: only for the 5 key-gated tools
#   (FRED_API_KEY, CENSUS_API_KEY, BEA_API_KEY, DOL_API_KEY work the same way)
