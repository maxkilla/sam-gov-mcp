name = "sam-gov-mcp"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

# Keep variables set in the Cloudflare dashboard. Without this, every `wrangler deploy`
# deletes dashboard-defined plain-text variables that are not in this file.
# (Secrets are never deleted, so prefer storing keys and tokens as Secrets.)
keep_vars = true

# Upstream response cache (see README). Namespace: sam-gov-mcp-cache
[[kv_namespaces]]
binding = "CACHE"
id = "2e6735d50f1a4b2fa2f7de0604d1bbf2"

# USAspending and OFAC reject requests from inside Cloudflare (HTTP 525), so they go through this relay.
# Source: relay/index.ts (a Supabase edge function). Also set the RELAY_TOKEN secret.
[vars]
GOV_RELAY_URL = "https://lnnizyeugffmkzdkoqjw.supabase.co/functions/v1/gov-relay"

# Secrets (never put these here):
#   wrangler secret put MCP_AUTH_TOKEN     # required: bearer token for your agents
#   wrangler secret put SAM_GOV_API_KEY    # optional: only for the 5 key-gated tools
#   (FRED_API_KEY, CENSUS_API_KEY, BEA_API_KEY, DOL_API_KEY work the same way)
